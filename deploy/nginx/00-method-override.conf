# RustDesk Console - HTTP 方法还原配置
#
# 配套文件：前端 src/requestErrorConfig.ts
# 前端把 PUT / PATCH / DELETE 统一改写为 POST，并携带 X-HTTP-Method-Override 头；
# nginx 在此把方法还原成真实方法后再转发给后端（默认 3000 端口）。
#
# 适用场景：客户端与服务器之间存在只放行 GET/POST 的安全设备
#（防火墙 / 上网行为管理 / WAF），会对 PUT、DELETE 直接发送 RST，
# 浏览器表现为 net::ERR_CONNECTION_RESET。
#
# 安装：
#   1. 本文件放到 /etc/nginx/conf.d/00-method-override.conf（map 必须位于 http 上下文）
#   2. 站点 server 的 `location /api/ { ... }` 内加三行：
#        set $rd_real_method $request_method;
#        if ($rd_override_method != "") { set $rd_real_method $rd_override_method; }
#        proxy_method $rd_real_method;
#   3. nginx -t && systemctl reload nginx
#
# 注意：只部署前端补丁而不部署本配置，前端的写操作会以 POST 抵达后端并返回 404。

map $http_x_http_method_override $rd_override_method {
    default                  "";
    "~*^\s*PUT\s*$"          "PUT";
    "~*^\s*PATCH\s*$"        "PATCH";
    "~*^\s*DELETE\s*$"       "DELETE";
}
